    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://github.com/luffyxxsenpai/prodk8s-foss
    targetRevision: main
    path: apps/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

---
############################
# wave -1: ClusterIssuer, wildcard cert, Traefik, CloudNativePG
############################
apiVersion: argoproj.io/v1alpha1
